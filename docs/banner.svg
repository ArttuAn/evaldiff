<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern></defs><rect width="1280" height="430" rx="22" fill="#101b30"/><rect width="1280" height="430" rx="22" fill="url(#g)"/><g font-family="Segoe UI,Arial,sans-serif"><path d="m85 47 20 9v17c0 12-9 21-20 26-11-5-20-14-20-26V56Z" fill="#68e2c2"/><path d="m75 72 7 7 14-16" fill="none" stroke="#101b30" stroke-width="4"/><text x="121" y="82" font-size="31" fill="#eef3ff" font-weight="700">evaldiff</text><text x="66" y="147" font-size="12" letter-spacing="4" fill="#68e2c2">DATASETS. GRADERS. BASELINE DIFFS.</text><text x="62" y="214" font-size="51" letter-spacing="-2" font-weight="650" fill="#f4f7ff">Run your evals.</text><text x="62" y="273" font-size="51" letter-spacing="-2" font-weight="650" fill="#f4f7ff">See what changed.</text><text x="66" y="318" font-size="17" fill="#a2afc7">JSONL → grade → compare → PR comment.</text><text x="66" y="387" font-size="11" letter-spacing="2" fill="#7184a3">EXACT MATCH · JSON SCHEMA · GITHUB ACTIONS</text><g transform="translate(765 94)"><rect x="9" y="10" width="440" height="242" rx="13" fill="#080f1d"/><rect width="440" height="242" rx="13" fill="#1b2941" stroke="#35445d"/><circle cx="22" cy="23" r="4" fill="#ff7e8c"/><circle cx="37" cy="23" r="4" fill="#f3cd7c"/><circle cx="52" cy="23" r="4" fill="#68e2c2"/><g font-family="Consolas,monospace" font-size="13"><text x="23" y="66" fill="#9facc6">$ evaldiff run --baseline …</text><text x="23" y="106" fill="#f1f5fe">Pass rate 100% → 70%</text><text x="23" y="132" fill="#ff9aa5">3 new failures</text><text x="23" y="170" fill="#a5b3ce">FAIL route-refund</text><text x="23" y="192" fill="#a5b3ce">FAIL extract-contact</text><text x="23" y="214" fill="#a5b3ce">FAIL refusal</text></g></g></g></svg>
