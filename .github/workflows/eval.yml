name: Prompt evaluation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Evaluate against saved baseline
        run: npm run demo
      - name: Save evaluation artifacts even on regression
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptguard-report
          path: .promptguard/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Job summary
        if: always()
        run: |
          if [ -f .promptguard/report.md ]; then
            cat .promptguard/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
