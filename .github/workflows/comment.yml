name: Evaluation PR comment
on:
  workflow_run:
    workflows: [Prompt evaluation]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: eval-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    steps:
      # This is DEFAULT BRANCH code, NEVER pull-request code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Download the named artifact only from this triggering workflow run.
      # Artifact contents are treated as untrusted data, never executed.
      - uses: actions/download-artifact@v4
        with:
          name: promptguard-report
          path: .promptguard
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upsert validated PR report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/comment-pr.mjs
